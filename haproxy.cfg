global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    option forwardfor

    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend incoming
    bind *:80
    default_backend express_servers

backend express_servers
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200

    server service1 service1:3001 check inter 2s fall 2 rise 2
    server service2 service2:3002 check inter 2s fall 2 rise 2
    server service3 service3:3003 check inter 2s fall 2 rise 2
    server service4 service4:3004 check inter 2s fall 2 rise 2
    server service5 service5:3005 check inter 2s fall 2 rise 2
    server service6 service6:3006 check inter 2s fall 2 rise 2
