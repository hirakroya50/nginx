global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog

    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend incoming
    bind *:80
    default_backend nginx_servers

backend nginx_servers
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200

    server nginx_a nginx-a:80 check inter 2s fall 2 rise 2
    server nginx_b nginx-b:80 check inter 2s fall 2 rise 2
    
