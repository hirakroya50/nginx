# Least connections and Least time 
# Health checks and failover
# Timeouts and retries
# Shared sessions and data
# Graceful draining ---> stopping new requests to a server while letting its existing requests finish
        # example :  server service1:3001 down;
# HTTPS and proxy headers
# Monitoring
# Load testing
# Load balancer availability
# Service discovery

